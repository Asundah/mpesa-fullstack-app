<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Payment</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: none;
        }
        .card-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 20px;
            text-align: center;
        }
        .btn-mpesa {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            border-radius: 50px;
            width: 100%;
        }
        .btn-mpesa:hover {
            color: white;
            transform: scale(1.02);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
        }
        .nav-link {
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-mobile-alt"></i> M-Pesa Payment</h2>
                    </div>
                    <div class="card-body p-4">
                        <div id="alert" class="alert" style="display:none;"></div>
                        <div id="loader" class="text-center" style="display:none;">
                            <div class="spinner-border text-primary"></div>
                            <p class="mt-2">Processing...</p>
                        </div>
                        
                        <form id="paymentForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Phone Number</label>
                                <input type="tel" id="phoneNumber" class="form-control" placeholder="712345678" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Amount (KES)</label>
                                <input type="number" id="amount" class="form-control" placeholder="Enter amount" min="1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Account Reference</label>
                                <input type="text" id="accountReference" class="form-control" value="PAYMENT001">
                            </div>
                            <button type="submit" class="btn-mpesa" id="payButton">
                                <i class="fas fa-check-circle"></i> Pay Now
                            </button>
                        </form>
                        
                        <hr>
                        <div class="text-center">
                            <a href="/transactions" class="btn btn-link">
                                <i class="fas fa-history"></i> View Transactions
                            </a>
                            <a href="/dashboard" class="btn btn-link">
                                <i class="fas fa-chart-bar"></i> Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = '254' + document.getElementById('phoneNumber').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const ref = document.getElementById('accountReference').value.trim();
            
            const alert = document.getElementById('alert');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('payButton');
            
            loader.style.display = 'block';
            btn.disabled = true;
            alert.style.display = 'none';
            
            try {
                const response = await fetch('/api/initiate-payment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        phone_number: phone,
                        amount: amount,
                        account_reference: ref
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert.className = 'alert alert-success';
                    alert.textContent = '✅ ' + data.message;
                    alert.style.display = 'block';
                } else {
                    alert.className = 'alert alert-danger';
                    alert.textContent = '❌ ' + data.message;
                    alert.style.display = 'block';
                }
            } catch (error) {
                alert.className = 'alert alert-danger';
                alert.textContent = '❌ Something went wrong!';
                alert.style.display = 'block';
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
