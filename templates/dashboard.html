<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand"><i class="fas fa-chart-bar"></i> Dashboard</span>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm">Pay</a>
                <a href="/transactions" class="btn btn-outline-light btn-sm">Transactions</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5>Total Transactions</h5>
                        <h2 id="total">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5>Successful</h5>
                        <h2 id="successful">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-danger text-white">
                    <div class="card-body">
                        <h5>Failed</h5>
                        <h2 id="failed">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-white">
                    <div class="card-body">
                        <h5>Total Amount</h5>
                        <h2>KES <span id="amount">0</span></h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                document.getElementById('total').textContent = data.total_transactions;
                document.getElementById('successful').textContent = data.successful;
                document.getElementById('failed').textContent = data.failed;
                document.getElementById('amount').textContent = data.total_amount_kes.toFixed(2);
            });
        
        // Auto-refresh every 5 seconds
        setInterval(() => location.reload(), 5000);
    </script>
</body>
</html>
